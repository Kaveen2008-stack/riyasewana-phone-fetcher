name: Test Phone Fetch

# Manual trigger only for now - click "Run workflow" in the Actions tab.
# No secrets needed for this test.
on:
  workflow_dispatch:

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run phone fetch test
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: node test-phone-fetch.js
